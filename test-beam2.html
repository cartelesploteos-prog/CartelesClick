<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
  .btn {
    position: relative; overflow: hidden; padding: 20px 40px; background: #FF5520; color: white; border-radius: 9999px;
    font-family: sans-serif; font-weight: bold; font-size: 16px; border: none; cursor: pointer;
  }
  .beam-container {
    pointer-events: none; position: absolute; inset: 0; border-radius: inherit;
    border: 4px solid transparent;
    -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
    mask-composite: exclude;
  }
  @keyframes spin {
    from { transform: translate(-50%, -50%) rotate(0deg); }
    to { transform: translate(-50%, -50%) rotate(360deg); }
  }
  .beam-spin {
    position: absolute; left: 50%; top: 50%; aspect-ratio: 1/1; width: 300%;
    animation: spin 4s linear infinite;
    background: conic-gradient(from 90deg at 50% 50%, transparent 0%, transparent 60%, rgba(255,255,255,0) 80%, #FCD34D 100%);
  }
</style>
</head>
<body>
  <button class="btn">
    Test Button
    <div class="beam-container">
      <div class="beam-spin"></div>
    </div>
  </button>
</body>
</html>
